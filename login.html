<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - DevBlog</title>
  <meta name="description" content="Log in to your DevBlog account to manage and publish your articles.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container">
      <!-- Injected dynamically by js/nav.js -->
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      <div class="auth-wrapper">
        <div class="form-card">
          
          <div class="form-header">
            <h2>Welcome Back</h2>
            <p>Log in to access your author dashboard and manage your blogs.</p>
          </div>

          <!-- Alert for validation errors -->
          <div id="auth-error" class="alert alert-danger" role="alert"></div>

          <!-- Demo Account Helper Callout -->
          <div class="alert alert-info" style="display: block; margin-bottom: 1.5rem;">
            <strong>Demo Account:</strong> <code>alex@example.com</code> / <code>password123</code>
            <div style="margin-top: 0.5rem;">
              <button type="button" id="demo-login-btn" class="btn btn-outline btn-sm" style="background:#fff;">Auto-fill Demo Credentials</button>
            </div>
          </div>

          <form id="login-form">
            <div class="form-group">
              <label for="email">Email or Username</label>
              <input type="text" id="email" class="form-control" placeholder="you@example.com or username" required autocomplete="username">
            </div>

            <div class="form-group">
              <div class="flex justify-between items-center" style="margin-bottom: var(--space-2);">
                <label for="password" style="margin-bottom: 0;">Password</label>
                <a href="#" style="font-size: var(--font-size-xs);" onclick="alert('For demo purposes, use password: password123'); return false;">Forgot?</a>
              </div>
              <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <div class="form-group form-check" style="margin-bottom: var(--space-6);">
              <input type="checkbox" id="remember" checked>
              <label for="remember" style="margin-bottom: 0; font-weight: normal;">Remember this browser session</label>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Sign In to Dashboard</button>
          </form>

          <p style="text-align: center; margin-top: var(--space-6); font-size: var(--font-size-sm); color: var(--color-text-muted);">
            Don't have an account yet? <a href="register.html" style="font-weight: 600;">Create one for free</a>
          </p>

        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-content">
      <div class="brand-logo" style="font-size: var(--font-size-lg);">
        <div class="logo-icon" style="width: 28px; height: 28px; font-size: 0.9rem;">B</div>
        <span>Dev<span>Blog</span></span>
      </div>
      <p style="color: var(--color-text-muted); font-size: var(--font-size-xs);">
        &copy; 2026 DevBlog. Fast, modern client-side blog application.
      </p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
